name: Docker Image CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      run: |
        IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/contenthive
        IMAGE_VERSION=$IMAGE_BASE:${{ steps.get_version.outputs.VERSION }}
        IMAGE_LATEST=$IMAGE_BASE:latest
        docker build . --file Dockerfile --tag $IMAGE_VERSION --tag $IMAGE_LATEST --build-arg APP_VERSION=${{ steps.get_version.outputs.VERSION }}
        docker push $IMAGE_VERSION
        docker push $IMAGE_LATEST
