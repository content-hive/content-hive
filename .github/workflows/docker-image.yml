name: Docker Image CI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Set up uv
      uses: astral-sh/setup-uv@v5

    - name: Update version and lockfile
      run: |
        uv version ${{ steps.get_version.outputs.VERSION }}
        uv lock

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compute image tags
      id: tags
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        GHCR="ghcr.io/${{ github.repository_owner }}/content-hive"
        DH="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/content-hive"
        {
          echo "TAGS<<EOF"
          echo "${GHCR}:${VERSION}"
          echo "${DH}:${VERSION}"
          if [[ "$VERSION" == *"beta"* ]]; then
            echo "${GHCR}:beta"
            echo "${DH}:beta"
          fi
          if [[ "$VERSION" == *"dev"* ]]; then
            echo "${GHCR}:dev"
            echo "${DH}:dev"
          fi
          if [[ "$VERSION" != *"dev"* && "$VERSION" != *"beta"* ]]; then
            echo "${GHCR}:latest"
            echo "${DH}:latest"
          fi
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.tags.outputs.TAGS }}
        build-args: |
          APP_VERSION=${{ steps.get_version.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max