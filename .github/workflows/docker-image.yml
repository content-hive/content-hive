name: Docker Image CI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Validate release version
      id: version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      run: uv run --with packaging python .github/scripts/validate_release_version.py

    - name: Update version and lockfile
      env:
        APP_VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        uv version "$APP_VERSION"
        uv lock

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compute image tags
      id: tags
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        CHANNEL: ${{ steps.version.outputs.CHANNEL }}
        GHCR_OWNER: ${{ github.repository_owner }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        GHCR="ghcr.io/${GHCR_OWNER}/content-hive"
        DH="docker.io/${DOCKERHUB_USERNAME}/content-hive"
        {
          echo "TAGS<<EOF"
          echo "${GHCR}:${VERSION}"
          echo "${DH}:${VERSION}"
          echo "${GHCR}:${CHANNEL}"
          echo "${DH}:${CHANNEL}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.tags.outputs.TAGS }}
        build-args: |
          APP_VERSION=${{ steps.version.outputs.VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
