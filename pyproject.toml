[project]
name = "content-hive"
version = "0.4.8.dev1"
description = "A content management system built with FastAPI and SQLAlchemy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles~=24.0",
    "aiohttp~=3.13",
    "aiosqlite~=0.22.0",
    "alembic~=1.16.0",
    "fastapi~=0.128.0",
    "packaging~=26.0",
    "pwdlib[argon2]~=0.2.1",
    "pydantic-settings~=2.0.0",
    "python-jose[cryptography]~=3.5.0",
    "python-magic~=0.4.27",
    "python-multipart~=0.0.20",
    "ruamel-yaml~=0.18",
    "sqlalchemy~=2.0.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]
ignore = [
    "B008",    # FastAPI Query/Depends in function defaults is intentional
    "UP007",   # Allow `X | Y` vs `Optional[X]` — pydantic handles both
]

[tool.ruff.format]
quote-style = "double"
