services:
  content-hive:
    build: 
      context: .
      args:
        - APP_VERSION=0.3.0
    container_name: content-hive
    ports:
      - "6123:6123"
    volumes:
      - ./data:/config/data
      - ./logs:/config/logs
      - ./plugins:/config/plugins
    environment:
      - TZ=Asia/Shanghai
      - ENVIRONMENT=${ENVIRONMENT}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
