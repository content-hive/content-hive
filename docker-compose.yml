services:
  content-hive:
    build: 
      context: .
      args:
        - APP_VERSION=${APP_VERSION}
    container_name: content-hive
    ports:
      - "6123:6123"
    volumes:
      - ./runtime-data:/config
    environment:
      - TZ=Asia/Shanghai
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
